[project]
name = "ten-k-dcf"
version = "0.1.0"
description = "Parsity capstone: 10-K extraction and DCF valuation"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.0",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

