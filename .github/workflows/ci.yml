name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The repo default is already read-only; state it here so the workflow keeps
# the minimum even if that default is ever relaxed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        # backend/ is the workspace member; uv sync resolves the workspace root
        # (and its uv.lock) on its own, so the env lands at the repo root.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Reads .python-version, so CI uses the same interpreter as local dev.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      # Pinned: a new ruff release adds rules and would fail the gate for no
      # reason. Bump deliberately.
      - name: Lint
        run: uvx ruff@0.17.5 check app scripts tests

  frontend:
    name: tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        # Mirrors what Databricks Apps runs at deploy time (npm ci + build),
        # so a stale frontend/package-lock.json fails here instead of there.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=dev

      # `npm run build` is `tsc --noEmit && vite build`, so this covers type
      # checking and the production bundle FastAPI serves.
      - name: Type check and build
        run: npm run build
